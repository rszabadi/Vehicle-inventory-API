name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_NAME: swiss
      DB_USER: swiss
      DB_PASSWORD: ci-only-password
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: swiss
          POSTGRES_USER: swiss
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiss -d swiss"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

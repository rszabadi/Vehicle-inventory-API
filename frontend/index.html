<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle Inventory</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="badge" aria-hidden="true">VI</span>
        <span class="brand-name">Vehicle Inventory</span>
      </a>
      <nav>
        <a href="/swagger-ui/index.html">API docs</a>
        <button id="logout" type="button" class="ghost">Log out</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="Inventory summary">
      <button type="button" class="stat" data-filter="" aria-pressed="true">
        <span class="stat-label">All vehicles</span>
        <span class="stat-value" id="count-all">0</span>
      </button>
      <button type="button" class="stat stat-available" data-filter="AVAILABLE" aria-pressed="false">
        <span class="stat-label">Available</span>
        <span class="stat-value" id="count-AVAILABLE">0</span>
      </button>
      <button type="button" class="stat stat-reserved" data-filter="RESERVED" aria-pressed="false">
        <span class="stat-label">Reserved</span>
        <span class="stat-value" id="count-RESERVED">0</span>
      </button>
      <button type="button" class="stat stat-sold" data-filter="SOLD" aria-pressed="false">
        <span class="stat-label">Sold</span>
        <span class="stat-value" id="count-SOLD">0</span>
      </button>
      <div class="stat stock">
        <span class="stat-label">Available stock value</span>
        <span class="stat-value" id="stock-value">0</span>
      </div>
    </section>

    <div class="toolbar">
      <label class="search">Search
        <input id="search" type="search" placeholder="Brand or model" autocomplete="off">
      </label>
      <p id="message" role="status"></p>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th aria-sort="none"><button type="button" data-sort="brand">Vehicle</button></th>
            <th class="num" aria-sort="none"><button type="button" data-sort="year">Year</button></th>
            <th class="num" aria-sort="none"><button type="button" data-sort="km">Km</button></th>
            <th class="num" aria-sort="none"><button type="button" data-sort="price">Price</button></th>
            <th aria-sort="none"><button type="button" data-sort="status">Status</button></th>
            <th aria-sort="none"><button type="button" data-sort="documents">Documents</button></th>
            <th><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="vehicles"></tbody>
      </table>
      <p id="empty" class="empty" hidden></p>
    </div>

    <section class="panel">
      <h2>Add a vehicle</h2>
      <form id="add-form" class="grid-form">
        <label>Brand <input name="brand" required></label>
        <label>Model <input name="model" required></label>
        <label>Year <input name="year" type="number" min="1950" required></label>
        <label>Km <input name="km" type="number" min="0" required></label>
        <label>Price (EUR) <input name="price" type="number" min="1" required></label>
        <button type="submit">Add vehicle</button>
      </form>
    </section>
  </main>

  <dialog id="docs-dialog">
    <h2 id="docs-title"></h2>
    <p id="docs-message" role="status"></p>
    <ul id="docs-list"></ul>
    <form id="doc-form">
      <select name="type" id="doc-type" aria-label="Document type"></select>
      <input name="expiresOn" type="date" aria-label="Expiry date">
      <button type="submit">Add document</button>
    </form>
    <button id="docs-close" type="button">Close</button>
  </dialog>
</body>
</html>
